
name: LAB9 - Pipeline CI/CD

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  Build:
    name: Build e Testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Executar testes
        run: PYTHONPATH=. pytest tests/ -v

  Imagem:
    name: Construir e publicar imagem Docker
    needs: Build
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir e publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            yasminalencar/lab8-api:${{ github.ref_name }}
            yasminalencar/lab8-api:sha-${{ github.sha }}

  Deploy_Homologacao:
    name: Validar imagem de homologacao
    needs: Imagem
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: Homologacao

    steps:
      - name: Entrar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verificar imagem publicada
        run: |
          docker manifest inspect yasminalencar/lab8-api:${{ github.ref_name }} > /dev/null
          echo "Imagem de homologacao publicada e validada."
          echo "Deploy na EC2 pendente de infraestrutura."

  Deploy_Producao:
    name: Aprovacao e validacao para producao
    needs: Imagem
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Producao

    steps:
      - name: Entrar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verificar imagem publicada
        run: |
          docker manifest inspect yasminalencar/lab8-api:${{ github.ref_name }} > /dev/null
          echo "Imagem de producao publicada e validada."
          echo "Deploy na EC2 pendente de infraestrutura."
