
name: LAB9 - Pipeline CI/CD

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  Build:
    name: Build e Testes
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Executar testes
        run: PYTHONPATH=. pytest tests/ -v

  Imagem:
    name: Construir e publicar imagem Docker
    needs: Build
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir e publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            yasminalencar/lab8-api:${{ github.ref_name }}
            yasminalencar/lab8-api:sha-${{ github.sha }}

  Deploy_Homologacao:
    name: Deploy Homologacao
    needs: Imagem
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: Homologacao
    steps:
      - name: Atualizar ambiente de homologacao
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOMOLOG_EC2_HOST }}
          username: ${{ secrets.HOMOLOG_EC2_USERNAME }}
          key: ${{ secrets.HOMOLOG_EC2_SSH_KEY }}
          script: |
            sudo docker pull yasminalencar/lab8-api:develop
            sudo docker stop lab9-homologacao || true
            sudo docker rm lab9-homologacao || true
            sudo docker run -d \
              --name lab9-homologacao \
              --restart unless-stopped \
              -p 8080:8080 \
              yasminalencar/lab8-api:develop
            sudo docker ps

  Deploy_Producao:
    name: Deploy Producao
    needs: Imagem
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Producao
    steps:
      - name: Atualizar ambiente de producao
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull yasminalencar/lab8-api:main
            sudo docker stop lab9-producao || true
            sudo docker rm lab9-producao || true
            sudo docker run -d \
              --name lab9-producao \
              --restart unless-stopped \
              -p 8080:8080 \
              yasminalencar/lab8-api:main
            sudo docker ps
