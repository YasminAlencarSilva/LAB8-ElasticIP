
name: LAB9 - Pipeline CI/CD

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build e Testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Executar testes
        run: |
          PYTHONPATH=. pytest tests/ -v

  imagem:
    name: Construir e publicar imagem Docker
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir e publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            yasminalencar/lab8-api:${{ github.ref_name }}
            yasminalencar/lab8-api:sha-${{ github.sha }}

  deploy_homologacao:
    name: Deploy Homologacao
    runs-on: ubuntu-latest
    needs: imagem
    if: github.ref == 'refs/heads/develop'
    environment: Homologacao

    steps:
      - name: Atualizar ambiente de homologacao
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOMOLOG_EC2_HOST }}
          username: ${{ secrets.HOMOLOG_EC2_USERNAME }}
          key: ${{ secrets.HOMOLOG_EC2_SSH_KEY }}
          script: |
            sudo docker pull yasminalencar/lab8-api:develop
            sudo docker stop lab9-homologacao || true
            sudo docker rm lab9-homologacao || true
            sudo docker run -d \
              --name lab9-homologacao \
              --restart unless-stopped \
              -p 8080:8080 \
              yasminalencar/lab8-api:develop

            sudo docker ps

  deploy_producao:
    name: Deploy Producao
    runs-on: ubuntu-latest
    needs: imagem
    if: github.ref == 'refs/heads/main'
    environment: Producao

    steps:
      - name: Atualizar ambiente de producao
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull yasminalencar/lab8-api:main
            sudo docker stop lab9-producao || true
            sudo docker rm lab9-producao || true
            sudo docker run -d \
              --name lab9-producao \
              --restart unless-stopped \
              -p 8080:8080 \
              yasminalencar/lab8-api:main

            sudo docker ps
